[project]
name = "medscribe"
version = "1.0.0"
description = "Clinical Notes API & AI Summarization Service"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Nikhil Varma", email = "vnvarma39@gmail.com" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "openai>=1.35.0",
    "streamlit>=1.39.0",
    "plotly>=5.24.0",
    "pandas>=2.2.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
asyncio_mode = "strict"

[tool.ruff]
line-length = 100
target-version = "py311"
